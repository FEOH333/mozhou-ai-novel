<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>墨舟 · AI 小说写作工具</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z' fill='none' stroke='currentColor' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand-wrap">
      <a class="brand" href="#/library" aria-label="返回作品库">
        <span class="brand-ink"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></span>
        墨舟 <span class="brand-sub">AI 小说写作工具</span> <span class="brand-ver">V0.109.0</span>
      </a>
    </div>
    <nav id="main-nav" aria-label="主导航"></nav>
    <div class="topbar-right">
      <span id="run-chip" class="run-chip hidden"></span>
      <span id="cache-badge" class="badge badge-warn hidden"></span>
      <span id="peak-badge" class="badge hidden"></span>
      <span id="embedding-badge" class="badge hidden"></span>
      <span id="cost-badge" class="badge" title="全部作品累计费用 / 已节省">¥0.00</span>
      <button id="theme-toggle" class="theme-toggle" title="切换明/暗主题" aria-label="切换主题"></button>
    </div>
  </header>
  <main id="view"></main>
  <div id="toast-container"></div>
</div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
